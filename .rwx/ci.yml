on:
  github:
    pull_request:
      init:
        commit-sha: ${{ event.git.sha }}
    push:
      if: ${{ event.git.branch == 'main' }}
      init:
        commit-sha: ${{ event.git.sha }}
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
base:
  image: ubuntu:24.04
  config: rwx/base 1.1.1

tasks:
  - key: code
    call: git/clone 2.0.8
    with:
      repository: https://github.com/rwx-cloud/cypress-rwx-reporter.git
      ref: ${{ init.commit-sha }}

  - key: tool-versions
    use: code
    call: rwx/tool-versions 1.0.8
    filter:
      - .tool-versions

  # The lowest Node of every major that package.json's `engines` claims, plus .tool-versions
  - key: test
    parallel:
      matrix:
        node-version:
          - "20.1.0"
          - "22.0.0"
          - "${{ tasks.tool-versions.values.nodejs }}"
    call: ${{ run.dir }}/test-node-version.yml
    init:
      node-version: ${{ parallel.node-version }}
      commit-sha: ${{ init.commit-sha }}
