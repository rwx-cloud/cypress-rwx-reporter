base:
  image: ubuntu:24.04
  config: rwx/base 1.1.1

tasks:
  - key: code
    call: git/clone 2.0.8
    with:
      repository: https://github.com/rwx-cloud/cypress-rwx-reporter.git
      ref: ${{ init.commit-sha }}

  - key: node
    call: nodejs/install 1.1.15
    with:
      node-version: ${{ init.node-version }}

  - key: node-modules
    use: [code, node]
    runner:
      tmpfs: true
    run: npm ci
    filter:
      - package.json
      - package-lock.json

  - key: unit-tests
    use: node-modules
    run: npm run test:unit

  - key: chrome
    call: google/install-chrome 2.1.12
    with:
      chrome-version: stable

  - key: integration-tests
    use: [chrome, node-modules]
    run: npm run test:integration
